<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Workflow 체험판 — 합성 데이터 · 서버 전송 없음</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<script src="state.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">본문으로 건너뛰기</a>
<div class="demo-banner" id="demo-banner" role="note">
  <strong>합성 데이터 체험판 · 서버 전송 없음 · 실제 운영 앱 아님</strong>
  <span class="demo-banner-sub">모든 상태는 이 탭의 메모리에만 있고 새로고침하면 처음으로 돌아갑니다. 실제 백엔드와 연결되어 있지 않습니다.</span>
</div>
<header class="topbar">
  <button type="button" class="btn btn-ghost menu-toggle" id="menu-toggle" aria-controls="sidebar" aria-expanded="false">메뉴</button>
  <span class="topbar-title"><span class="dot" aria-hidden="true"></span>Review Workflow <span class="muted">체험판</span></span>
  <button type="button" class="btn" id="reset-button">체험 초기화</button>
</header>
<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="체험판 메뉴">
    <p class="sidebar-label">합성 데이터 체험판 · 서버 전송 없음 · 실제 운영 앱 아님</p>
    <ul class="nav-list" id="nav-list"></ul>
    <p class="sidebar-note">브라우저 전용 정적 시뮬레이터입니다. 로그인·입력·업로드가 없습니다.</p>
  </nav>
  <main class="main" id="main" tabindex="-1">
    <noscript><p class="notice">이 체험판은 JavaScript가 필요합니다. 데이터는 서버로 보내지 않습니다.</p></noscript>
  </main>
</div>
<dialog class="dialog" id="approve-dialog" aria-labelledby="approve-title">
  <h2 id="approve-title">리뷰로 등록 — 사람의 확인</h2>
  <p class="muted" id="approve-desc">후보 값을 읽기 전용으로 보여 줍니다. 체험판에서는 값을 고치지 않고, 확인을 누르면 메모리 안에서만 리뷰가 생깁니다.</p>
  <dl class="kv" id="approve-values"></dl>
  <div class="dialog-actions">
    <button type="button" class="btn" id="approve-cancel">취소</button>
    <button type="button" class="btn btn-primary" id="approve-confirm">확인하고 등록</button>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
